version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
      POSTGRES_DB: devpilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-engine:
    build: 
      context: ./ai-engine
    env_file:
      - ./ai-engine/.env
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - "./backend/var/uploads:/home/devanssh/Desktop/Projects '27/devpilot-barclaysMDM/backend/var/uploads"

volumes:
  postgres_data:
