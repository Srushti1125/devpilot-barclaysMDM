name: AI Engine Test Reporting

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: AI engine tests
    runs-on: ubuntu-latest
    # docling pulls ~2.5 GB of torch; installs are slow even with a warm pip cache.
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-engine/requirements-dev.txt

      - name: Run AI Engine Test Suite
        working-directory: ai-engine
        # Passes with zero API keys: no provider call happens at import time and
        # settings.validate() is not executed by the suite (see app/config.py).
        run: pytest tests/ -q --junitxml=junit.xml

      - name: Add results to workflow summary
        if: always()
        working-directory: ai-engine
        run: |
          python -c 'import os, xml.etree.ElementTree as ET; p="junit.xml"; root=ET.parse(p).getroot() if os.path.exists(p) else None; suites=[root] if root is not None and root.tag == "testsuite" else list(root or []); tests=sum(int(s.get("tests", 0)) for s in suites); failures=sum(int(s.get("failures", 0))+int(s.get("errors", 0)) for s in suites); skipped=sum(int(s.get("skipped", 0)) for s in suites); f=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); f.write(chr(10).join(["## AI engine validation results", "", "| Tests | Failures/errors | Skipped |", "|---:|---:|---:|", "| %d | %d | %d |" % (tests, failures, skipped), "", "This workflow reports validation results. Merge requirements are configured separately in repository settings.", ""])); f.close()'

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-engine-test-report
          path: ai-engine/junit.xml
          if-no-files-found: warn
